name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# Three jobs. `verify` gates the epixodic client app; the root vitest run excludes
# `score-relay/**`. `e2e` runs the Playwright journeys against the published packages.
# `score-relay` gates the relay subpackage on its own install, against a Postgres
# service, because its crowd suites are integration tests.
# (Postgres-backed CI runs only in PUBLIC repos, which carry no Actions charges.)

jobs:
  verify:
    name: lint · types · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release-scope.sh diffs the PR's merge commit against its first parent, the base tip.
          fetch-depth: 2

      # The release path's light path: a release-please PR into `master`, or the back-merge PR
      # (`master` -> `dev`, opened by back-merge.yml), whose diff is the version files alone skips
      # every step below the lockfile guard. Its tree was verified when it landed, and this job
      # still reports, so `master`'s required check passes. Anything else gets the full run.
      - name: Release-path scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-scope.sh

      # A pnpm that does not match this repo's `packageManager` pin writes an `@pnpm/exe` block
      # into the lockfile; a pnpm that DOES match strips it out again. Committed, it makes every
      # correctly-provisioned checkout permanently dirty and drowns real work in `git status`. It was
      # cleaned out of six repos on 2026-09-08 and reappeared in two working trees the same
      # afternoon, so the committed state needs a guard rather than vigilance.
      #
      # The pattern excludes `@pnpm/exe.<platform>` — those are legitimate optional deps of `pnpm`
      # itself and every clean lockfile holds 24 of them, so the obvious grep fails every repo.
      - name: Lockfiles must not carry an @pnpm/exe block
        run: |
          locks=$(git ls-files '*pnpm-lock.yaml')
          if [ -z "$locks" ]; then
            echo "::error::no tracked pnpm-lock.yaml found — this check would pass vacuously"
            exit 1
          fi
          bad=0
          while IFS= read -r f; do
            if grep -qE "@pnpm/exe[^.]" "$f"; then
              echo "::error file=$f::$f carries an @pnpm/exe block, written only by a pnpm that does not match this repo's packageManager pin. Reinstall with the pinned pnpm and commit the lockfile."
              bad=1
            fi
          done <<LOCKS
          $locks
          LOCKS
          exit $bad

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.light != 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.light != 'true'
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml `link:` overrides win over package.json pins, and the
      # GitHub runner has no sibling clones at ../factory, ../courthive-components
      # or ../scoringVisualizations, so those overrides would produce dangling
      # symlinks. Strip them so CI installs the published versions the package.json
      # pins name. Mirrors TMX ci.yml.
      - name: 'Strip link: overrides for CI'
        if: steps.scope.outputs.light != 'true'
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before.split('\n').filter(line => !/:\s*link:\S+\s*\$/.test(line)).join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "
          rm -f pnpm-lock.yaml

      - run: pnpm install
        if: steps.scope.outputs.light != 'true'
      - run: pnpm lint
        if: steps.scope.outputs.light != 'true'
      - run: pnpm check-types
        if: steps.scope.outputs.light != 'true'

      # `pnpm test` is `TZ=UTC vitest`, which is watch mode. Vitest does switch to a
      # single run when CI=true, but pass --run explicitly so this cannot hang if
      # that detection ever changes.
      - run: pnpm test --run
        if: steps.scope.outputs.light != 'true'

      - run: pnpm build
        if: steps.scope.outputs.light != 'true'

  e2e:
    name: playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # release-scope.sh diffs the PR's merge commit against its first parent, the base tip.
          fetch-depth: 2

      # Same light path as `verify`: a release-path PR whose diff is the version files alone skips the run.
      - name: Release-path scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-scope.sh

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.light != 'true'
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.light != 'true'
        with:
          node-version: 24
          cache: pnpm

      # As in `verify`: no sibling clones on the runner, so the journeys run against the published
      # packages the package.json pins name.
      - name: 'Strip link: overrides for CI'
        if: steps.scope.outputs.light != 'true'
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before.split('\n').filter(line => !/:\s*link:\S+\s*\$/.test(line)).join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "
          rm -f pnpm-lock.yaml

      - run: pnpm install
        if: steps.scope.outputs.light != 'true'

      # pnpm install does not fetch the browser binary.
      - name: Install Playwright Chromium
        if: steps.scope.outputs.light != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The journeys ran only by hand until 2026-10-18; three (01, 06, 08) had been failing unseen since
      # April. CI=1 makes Playwright start its own vite server (reuseExistingServer is off under CI).
      - name: Run e2e
        if: steps.scope.outputs.light != 'true'
        run: pnpm test:e2e
        env:
          CI: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  score-relay:
    name: score-relay · types · build · test (Postgres)
    runs-on: ubuntu-latest
    services:
      # The image Guidon and competition-factory-server pin, so "the same world" is one definition.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: crowd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: score-relay
    env:
      # The crowd suites (storage, /crowd namespace, REST API, webhook) skip without it.
      CROWD_POSTGRES_URL_TEST: postgresql://relay:relay@localhost:5432/crowd_test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Release-path scope
        id: scope
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-scope.sh

      - uses: pnpm/action-setup@v6
        if: steps.scope.outputs.light != 'true'
        with:
          package_json_file: score-relay/package.json
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.light != 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: score-relay/pnpm-lock.yaml

      # score-relay is its own workspace root (`packages: []`) with its own lockfile and no
      # `link:` overrides, so it installs exactly what it deploys.
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.light != 'true'
      - run: pnpm check-types
        if: steps.scope.outputs.light != 'true'
      # The build is what copies the crowd SQL migrations into dist/; it fails without them.
      - run: pnpm build
        if: steps.scope.outputs.light != 'true'

      # A skipped crowd suite means the database never reached it, and the job would pass on the
      # unit tests alone. The JSON report is read back and any skipped test fails the job.
      - name: test (no skipped suites)
        if: steps.scope.outputs.light != 'true'
        run: |
          pnpm exec vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
          node -e "
          const r = require('./vitest-results.json');
          const skipped = r.numPendingTests + r.numTodoTests;
          console.log('tests: ' + r.numTotalTests + ' total, ' + r.numPassedTests + ' passed, ' + skipped + ' skipped');
          if (r.numTotalTests === 0) { console.error('::error::no tests ran'); process.exit(1); }
          if (skipped > 0) { console.error('::error::' + skipped + ' test(s) skipped — is CROWD_POSTGRES_URL_TEST reaching the suites?'); process.exit(1); }
          "
