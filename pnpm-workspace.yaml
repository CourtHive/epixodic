packages:
  - '.'

allowBuilds:
  esbuild: true

overrides:
  typescript: 6.0.3 # block native TS7 (no classic JS API — crashes tsc/nest/sonarjs); pairs with renovate TS-major block
  # Was '@tennisvisuals/scoring-visualizations' — the package's OLD scope. The
  # dependency has been '@courthive/scoring-visualizations' for some time, so the
  # override named a package epixodic does not depend on and silently did nothing:
  # this repo resolved scoring-visualizations from npm (0.2.12 on disk) while every
  # sibling built it from source. The failure mode is the quiet one — the override
  # still LOOKS present, and the package still resolves, just not to the checkout.
  '@courthive/scoring-visualizations': link:../scoringVisualizations
  courthive-components: link:../courthive-components
  tods-competition-factory: link:../factory
  # Security overrides for transitive deps (all dev/CI-scope; epixodic is not
  # published). minimatch is scoped to the vulnerable <3.1.3 range so 5.x/10.x
  # in the tree are left untouched.
  lodash: ^4.18.0
  'minimatch@<3.1.3': 10.2.6
  # brace-expansion ReDoS (GHSA-3jxr-9vmj-r5cp); via source-map-explorer>ejs>jake tooling. Patched 2.1.2.
  brace-expansion@2: '>=2.1.2'
  undici: ^8.0.0
  uuid: ^14.0.0
  # fast-uri host confusion (GHSA-v2hh-gcrm-f6hx / CVE-2026-16221); via commitlint>ajv. Patched 3.1.4.
  fast-uri: '^4.0.0'

# pnpm v11 reads project-level settings from pnpm-workspace.yaml (not from
# .npmrc, which pnpm v11.1.3 no longer merges for non-auth keys).
#
# minimumReleaseAge: 0 disables pnpm v11's supply-chain freshness policy
#   so Renovate bumps to recently-published deps don't block installs or
#   husky pre-commit hooks.
# verifyDepsBeforeRun: false suppresses the deps-status check that fires
#   before every `pnpm <script>` invocation. Lockfiles are routinely
#   briefly stale (mentat-pull-all.sh deletes lockfiles before each
#   build cycle), so the check is noise.
minimumReleaseAge: 0
verifyDepsBeforeRun: false
