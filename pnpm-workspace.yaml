# score-relay is intentionally NOT listed here. It has its own
# pnpm-workspace.yaml (`packages: []`) declaring it a standalone
# workspace root with its own pnpm-lock.yaml. Listing it here makes
# pnpm v11 consolidate its dependencies into epixodic's root lockfile
# on install AND delete `score-relay/pnpm-lock.yaml` as part of that
# normalization — which breaks `mentat-build-all.sh`'s install path
# (`pnpm install --ignore-workspace` from score-relay/, which
# requires the standalone lockfile). Keep score-relay installs
# separate; run `pnpm install` inside `score-relay/` to refresh.
# Mirrors the same fix made in competition-factory-server for
# audit-worker.
packages:
  - '.'

allowBuilds:
  esbuild: true

overrides:
  '@tennisvisuals/scoring-visualizations': link:../scoringVisualizations
  courthive-components: link:../courthive-components
  tods-competition-factory: link:../factory
  # Security overrides for transitive deps (all dev/CI-scope; epixodic is not
  # published). minimatch is scoped to the vulnerable <3.1.3 range so 5.x/10.x
  # in the tree are left untouched.
  lodash: ^4.18.0
  'minimatch@<3.1.3': 10.2.5
  undici: ^8.0.0
  uuid: ^14.0.0

# pnpm v11 reads project-level settings from pnpm-workspace.yaml (not from
# .npmrc, which pnpm v11.1.3 no longer merges for non-auth keys).
#
# minimumReleaseAge: 0 disables pnpm v11's supply-chain freshness policy
#   so Renovate bumps to recently-published deps don't block installs or
#   husky pre-commit hooks.
# verifyDepsBeforeRun: false suppresses the deps-status check that fires
#   before every `pnpm <script>` invocation. Lockfiles are routinely
#   briefly stale (mentat-pull-all.sh deletes lockfiles before each
#   build cycle), so the check is noise.
minimumReleaseAge: 0
verifyDepsBeforeRun: false
