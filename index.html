<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Epixodic</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://courthive.net/epixodic/" />
    <meta http-equiv="refresh" content="0; url=https://courthive.net/epixodic/" />
    <script>
      // Preserve the original path/hash/query when redirecting so deep links
      // like https://epixodic.com/#/m/<id> land on the same view at
      // courthive.net/epixodic/.
      (function () {
        var target = 'https://courthive.net/epixodic/';
        var suffix = (window.location.pathname || '/').replace(/^\/+/, '') + window.location.search + window.location.hash;
        window.location.replace(target + suffix);
      })();
    </script>
    <style>
      body { font: 14px/1.4 system-ui, sans-serif; color: #333; max-width: 32em; margin: 4em auto; padding: 0 1em; }
      a { color: #1d6fd4; }
    </style>
  </head>
  <body>
    <p>Epixodic has moved. Redirecting to <a href="https://courthive.net/epixodic/">courthive.net/epixodic/</a>…</p>
  </body>
</html>
